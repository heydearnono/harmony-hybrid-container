<!DOCTYPE html>
<!--
  混合容器最小基座的 H5 侧。三条通信路径各占一节，页面本身就是自报结果的测试台。
  对应 experiments/002-混合容器最小基座 的步 3–7。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HybridShell</title>
  <script src="./js/probe.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 0; padding: 16px; font-size: 15px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: #888; font-size: 12px; margin-bottom: 16px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    h2 { font-size: 14px; margin: 0 0 8px; color: #333; }
    button { font-size: 14px; padding: 6px 12px; margin-right: 8px; }
    .out { font-family: ui-monospace, monospace; font-size: 12px; color: #0a6; word-break: break-all; }
    .warn { color: #c60; }
  </style>
</head>
<body>
  <h1 id="text">HybridShell</h1>
  <div class="sub">$rawfile 加载的本地页面</div>

  <section>
    <h2>W6 外部脚本（预期：被 CORS 拦掉）</h2>
    <div id="probe" class="out">检测中…</div>
  </section>

  <section>
    <h2>路径一 应用侧 → 前端（原生点按钮触发）</h2>
    <div id="path1" class="out">等待 runJavaScript 调用 htmlTest()</div>
  </section>

  <section>
    <h2>路径二 前端 → 应用侧（registerJavaScriptProxy）</h2>
    <button onclick="callNative()">调 testObjName.echo()</button>
    <div id="path2" class="out">未调用</div>
  </section>

  <section>
    <h2>路径三 消息端口（双向）</h2>
    <button onclick="sendToNative()">postMessage 给应用侧</button>
    <div id="path3" class="out">等待应用侧下发端口</div>
  </section>

<script>
  // ---- W6：外部脚本是否真的被拦 ----------------------------------------
  document.getElementById('probe').innerHTML = window.__probeLoaded
    ? '<span class="warn">已加载（与预期不符，W6 需改写）</span>'
    : '未加载 —— 符合 W6 预期';

  // ---- 路径一：供应用侧 runJavaScript 调用 ------------------------------
  function htmlTest() {
    document.getElementById('path1').textContent =
      'htmlTest() 被调用 @ ' + new Date().toLocaleTimeString();
    document.getElementById('text').style.color = 'red';
    return 'h5 done';   // W10：应用侧收到的是 JSON 文本，需 JSON.parse
  }

  // ---- 路径二：调应用侧注册的对象 ---------------------------------------
  // 对象名与方法名来自 registerJavaScriptProxy(obj, 'testObjName', ['echo', 'deviceLabel'])。
  // W4：应用侧注册后不 refresh() 的话，这里 testObjName 是 undefined。
  function callNative() {
    var out = document.getElementById('path2');
    if (typeof testObjName === 'undefined') {
      out.innerHTML = '<span class="warn">testObjName 未定义 —— 应用侧未注册或未 refresh（W4）</span>';
      return;
    }
    out.textContent = testObjName.echo('hello from H5') + ' / ' + testObjName.deviceLabel();
  }

  // ---- 路径三：端口 ------------------------------------------------------
  // W1：H5 侧是 onmessage / postMessage，ArkTS 侧才是 onMessageEvent / postMessageEvent。
  var h5Port = null;

  window.addEventListener('message', function (event) {
    if (event.data !== '__init_port__' || !event.ports || !event.ports[0]) {
      return;
    }
    h5Port = event.ports[0];
    h5Port.onmessage = function (e) {
      document.getElementById('path3').textContent = '收到应用侧：' + e.data;
    };
    document.getElementById('path3').textContent = '端口已就绪';
  });

  function sendToNative() {
    var out = document.getElementById('path3');
    if (h5Port === null) {
      out.innerHTML = '<span class="warn">端口未就绪，先在应用侧点「建端口」</span>';
      return;
    }
    // W3：WebMessage 只支持 string 与 ArrayBuffer，对象必须先序列化，否则静默收不到。
    h5Port.postMessage(JSON.stringify({ from: 'h5', at: Date.now() }));
    out.textContent = '已发送 JSON 字符串';
  }
</script>
</body>
</html>
